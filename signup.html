<!DOCTYPE html>
<html lang="en" class="ss-page-loading">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Sign up — Sociable Suite</title>
    <meta name="description"
        content="Create your Sociable Suite account to plan, publish, and analyze social content with your team.">

    <link href="./assets/img/favicon_1.png" rel="icon">
    <link href="./assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">

    <link href="./assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="./assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="./assets/vendor/aos/aos.css" rel="stylesheet">

    <link href="./assets/css/main.css" rel="stylesheet">
    <link href="./assets/css/responsive.css" rel="stylesheet">
</head>

<body class="ss-auth-page">
    <div id="ss-page-loader" class="ss-page-loader" role="status" aria-live="polite" aria-busy="true"
    aria-label="Loading page">
    <div class="ss-page-loader__inner">
        <img class="ss-page-loader__logo" src="./assets/img/sociable-suite-logo.png" alt="" width="200"
            height="60" decoding="async">
        <div class="ss-page-loader__spinner" aria-hidden="true"></div>
    </div>
</div>
    <main class="main">
        <section class="hero section ss-hero ss-auth-hero" aria-labelledby="auth-signup-heading">

            <div class="ss-grid"></div>
            <div class="ss-gradient ss-gradient-1"></div>
            <div class="ss-gradient ss-gradient-2"></div>

            <div class="container position-relative">
                <div class="row justify-content-center">
                    <div class="col-xl-6 col-lg-6 col-md-8">

                        <div class="ss-auth-card">
                            <div class="ss-auth-card-head text-center">
                                <div class="ss-badge justify-content-center">
                                    <span></span>
                                    Get started free
                                </div>
                                <h1 id="auth-signup-heading" class="ss-auth-heading">Create your account</h1>
                                <p class="ss-auth-lead">Join teams who plan, publish, and measure social from one
                                    calm dashboard—no credit card required to start.</p>
                            </div>

                            <form class="ss-auth-form" action="#" method="post" novalidate>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <div class="ss-auth-field mb-0">
                                            <label for="signup-name">Full name</label>
                                            <input id="signup-name" name="name" type="text" autocomplete="name"
                                                placeholder="Alex Morgan" required>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="ss-auth-field mb-0">
                                            <label for="signup-email">Work email</label>
                                            <input id="signup-email" name="email" type="email" autocomplete="email"
                                                placeholder="you@company.com" required>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="ss-auth-field mb-0">
                                            <label for="signup-password">Password</label>
                                            <input id="signup-password" name="password" type="password"
                                                autocomplete="new-password" placeholder="At least 8 characters"
                                                minlength="8" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="ss-auth-field ss-auth-checkbox mt-3">
                                    <input id="signup-terms" name="terms" type="checkbox" required>
                                    <label for="signup-terms">I agree to the <a href="#">Terms</a> and <a
                                            href="#">Privacy Policy</a></label>
                                </div>
                                <button type="submit" class="ss-auth-submit">
                                    Create account
                                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                                </button>
                            </form>

                            <div class="ss-auth-divider" role="presentation">
                                <span>or sign up with</span>
                            </div>

                            <div class="ss-auth-social" role="group" aria-label="Social sign-up">
                                <a class="ss-auth-social-btn ss-auth-social-btn--google" href="#"
                                    aria-label="Continue with Google">
                                    <i class="fab fa-google" aria-hidden="true"></i>
                                    <span>Google</span>
                                </a>
                                <a class="ss-auth-social-btn ss-auth-social-btn--facebook" href="#"
                                    aria-label="Continue with Facebook">
                                    <i class="fab fa-facebook-f" aria-hidden="true"></i>
                                    <span>Facebook</span>
                                </a>
                                <a class="ss-auth-social-btn ss-auth-social-btn--apple" href="#"
                                    aria-label="Continue with Apple">
                                    <i class="fab fa-apple" aria-hidden="true"></i>
                                    <span>Apple</span>
                                </a>
                            </div>

                            <p class="ss-auth-switch text-center mb-0">
                                Already have an account?
                                <a href="./login.html">Log in</a>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="./assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/vendor/aos/aos.js"></script>
    <script src="./assets/js/main.js"></script>
</body>

</html>
